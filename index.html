<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color"
      content="#09090d">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="V + M">

<link rel="apple-touch-icon"
      href="vm-app-icon.png">

<title>❤️ V + M ❤️</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #09090d;
}

body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 50% -10%,
            #6b3048 0%,
            #301925 28%,
            #111118 62%,
            #07070a 100%
        );

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    overflow: hidden;

    /*
       Important:
       The background is allowed to extend
       behind the iPhone status bar.
    */
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow {

    position: fixed;

    width: 450px;
    height: 450px;

    left: 50%;
    top: 25%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 130, 0.12),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

    animation:
        glowPulse 6s ease-in-out infinite;
}


@keyframes glowPulse {

    0%, 100% {
        opacity: 0.6;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15);
    }
}


/* =========================
   APP
========================= */

.app {

    width: 100%;

    /*
       100dvh works better on modern iPhones
       than the old 100vh.
    */

    height: 100dvh;

    display: flex;

    justify-content: center;

    align-items: center;

    /*
       Safe area is handled here rather
       than on the body, so the background
       still reaches the top.
    */

    padding-top:
        calc(
            env(safe-area-inset-top)
            + 10px
        );

    padding-right:
        20px;

    padding-bottom:
        calc(
            env(safe-area-inset-bottom)
            + 10px
        );

    padding-left:
        20px;
}


.content {

    width: 100%;

    max-width: 520px;

    text-align: center;
}


/* =========================
   HEART
========================= */

.heart {

    font-size: 55px;

    line-height: 1;

    margin-bottom: 18px;

    filter:
        drop-shadow(
            0 8px 22px
            rgba(255, 80, 130, 0.35)
        );

    animation:
        heartbeat 2.4s infinite;
}


@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    8% {
        transform: scale(1.12);
    }

    16% {
        transform: scale(1);
    }

    24% {
        transform: scale(1.07);
    }

    32% {
        transform: scale(1);
    }
}


/* =========================
   TITLE
========================= */

.title {

    margin: 0;

    font-size: 43px;

    font-weight: 700;

    letter-spacing: 5px;

    text-shadow:
        0 4px 25px
        rgba(255,255,255,0.12);
}


.since {

    margin-top: 7px;

    font-size: 14px;

    letter-spacing: 6px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.48);
}


/* =========================
   DATE
========================= */

.date {

    margin-top: 28px;

    font-size: 14px;

    color:
        rgba(255,255,255,0.55);

    letter-spacing: 0.3px;
}


/* =========================
   MAIN CARD
========================= */

.card {

    margin-top: 24px;

    padding: 18px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    border:
        1px solid
        rgba(255,255,255,0.10);

    box-shadow:

        0 30px 70px
        rgba(0,0,0,0.38),

        inset 0 1px 0
        rgba(255,255,255,0.07);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}


/* =========================
   YEARS / MONTHS / DAYS
========================= */

.units {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}


.unit {

    padding:
        22px
        8px
        17px;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.16);

    border:
        1px solid
        rgba(255,255,255,0.055);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.035);
}


.number {

    font-size: 39px;

    font-weight: 700;

    line-height: 1;

    font-variant-numeric:
        tabular-nums;

    transition:
        transform 0.15s ease;
}


.number.tick {

    transform:
        scale(1.025);
}


.label {

    margin-top: 10px;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,0.42);

    text-transform: uppercase;
}


/* =========================
   CLOCK
========================= */

.clock {

    margin-top: 23px;

    font-size: 36px;

    font-weight: 600;

    letter-spacing: 3px;

    font-variant-numeric:
        tabular-nums;

    color:
        rgba(255,255,255,0.94);

    text-shadow:
        0 0 30px
        rgba(255,255,255,0.10);
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 23px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.27);

    letter-spacing: 1.5px;
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 370px) {

    .title {
        font-size: 37px;
    }

    .heart {
        font-size: 48px;
    }

    .number {
        font-size: 31px;
    }

    .clock {
        font-size: 29px;
    }

    .card {
        padding: 14px;
    }
}


/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) {

    .app {

        align-items: flex-start;

        overflow-y: auto;

        height: auto;

        min-height: 100dvh;
    }

    .content {

        margin-top: 30px;

        margin-bottom: 30px;
    }
}

</style>

</head>


<body>


<div class="glow"></div>


<div class="app">

<div class="content">


    <!-- HEART -->

    <div class="heart">
        ❤️
    </div>


    <!-- TITLE -->

    <h1 class="title">
        V + M
    </h1>


    <div class="since">
        since
    </div>


    <!-- START DATE -->

    <div class="date">
        14 September 2025 · 17:00
    </div>


    <!-- COUNTER -->

    <div class="card">


        <div class="units">


            <div class="unit">

                <div
                    class="number"
                    id="years">

                    0

                </div>

                <div class="label">
                    Years
                </div>

            </div>


            <div class="unit">

                <div
                    class="number"
                    id="months">

                    0

                </div>

                <div class="label">
                    Months
                </div>

            </div>


            <div class="unit">

                <div
                    class="number"
                    id="days">

                    0

                </div>

                <div class="label">
                    Days
                </div>

            </div>


        </div>


        <!-- LIVE HH : MM : SS -->

        <div
            class="clock"
            id="clock">

            00 : 00 : 00

        </div>


    </div>


    <div class="footer">

        every second counts ❤️

    </div>


</div>

</div>



<script>


/* =========================
   FIXED START DATE

   14 September 2025
   17:00 local time
========================= */

const startDate =
    new Date(
        2025,
        8,
        14,
        17,
        0,
        0
    );


/* =========================
   CALCULATE TIME
========================= */

function calculateTime() {


    const now =
        new Date();


    /*
     * YEARS
     */

    let years =
        now.getFullYear()
        -
        startDate.getFullYear();


    let yearPoint =
        new Date(startDate);


    yearPoint.setFullYear(
        startDate.getFullYear()
        +
        years
    );


    if (yearPoint > now) {

        years--;

        yearPoint =
            new Date(startDate);

        yearPoint.setFullYear(
            startDate.getFullYear()
            +
            years
        );
    }


    /*
     * MONTHS
     */

    let months =
        now.getMonth()
        -
        yearPoint.getMonth();


    if (months < 0) {

        months += 12;
    }


    let monthPoint =
        new Date(yearPoint);


    monthPoint.setMonth(
        yearPoint.getMonth()
        +
        months
    );


    if (monthPoint > now) {

        months--;

        monthPoint =
            new Date(yearPoint);

        monthPoint.setMonth(
            yearPoint.getMonth()
            +
            months
        );
    }


    /*
     * REMAINING TIME
     */

    const difference =
        now.getTime()
        -
        monthPoint.getTime();


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const remaining =
        totalSeconds % 86400;


    const hours =
        Math.floor(
            remaining / 3600
        );


    const minutes =
        Math.floor(
            (remaining % 3600) / 60
        );


    const seconds =
        remaining % 60;


    /*
     * UPDATE YEARS
     */

    updateNumber(
        "years",
        years
    );


    /*
     * UPDATE MONTHS
     */

    updateNumber(
        "months",
        months
    );


    /*
     * UPDATE DAYS
     */

    updateNumber(
        "days",
        days
    );


    /*
     * UPDATE CLOCK
     */

    document.getElementById(
        "clock"
    ).textContent =

        String(hours).padStart(2, "0")
        +
        " : "
        +
        String(minutes).padStart(2, "0")
        +
        " : "
        +
        String(seconds).padStart(2, "0");

}


/* =========================
   NUMBER ANIMATION
========================= */

function updateNumber(
    id,
    value
) {

    const element =
        document.getElementById(id);


    if (
        element.textContent
        !==
        String(value)
    ) {

        element.textContent =
            value;

        element.classList.add(
            "tick"
        );


        setTimeout(
            function() {

                element.classList.remove(
                    "tick"
                );

            },
            150
        );
    }
}


/* =========================
   START
========================= */

calculateTime();


/* =========================
   UPDATE EVERY SECOND
========================= */

setInterval(
    calculateTime,
    1000
);

</script>


</body>

</html>
