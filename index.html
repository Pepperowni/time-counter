<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Time Since</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .date {
            color: #999;
            margin-bottom: 40px;
        }

        .counter {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.4;
        }

        .label {
            font-size: 16px;
            color: #999;
            margin-top: 5px;
        }

        button {
            margin-top: 45px;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="app">

    <h1>TIME SINCE</h1>

    <div class="date" id="startDate">
        Select a date
    </div>

    <div class="counter" id="counter">
        0 years<br>
        0 months<br>
        0 days<br>
        00:00:00
    </div>

    <button onclick="chooseDate()">
        Choose Start Date
    </button>

</div>

<script>

    // Change this date to whatever you want.
    // Format: YYYY-MM-DDTHH:MM:SS
    let startDate = new Date("2010-08-14T12:00:00");


    function calculateTime() {

        const now = new Date();

        let years = now.getFullYear() - startDate.getFullYear();

        let testDate = new Date(startDate);
        testDate.setFullYear(
            startDate.getFullYear() + years
        );

        // If we haven't reached the anniversary yet,
        // subtract one year.
        if (testDate > now) {
            years--;
            testDate = new Date(startDate);
            testDate.setFullYear(
                startDate.getFullYear() + years
            );
        }


        let months =
            now.getMonth() - testDate.getMonth();

        if (months < 0) {
            months += 12;
        }


        let monthDate = new Date(testDate);
        monthDate.setMonth(
            testDate.getMonth() + months
        );


        if (monthDate > now) {
            months--;

            monthDate = new Date(testDate);
            monthDate.setMonth(
                testDate.getMonth() + months
            );
        }


        // Remaining difference in milliseconds
        const difference =
            now.getTime() - monthDate.getTime();


        const totalSeconds =
            Math.floor(difference / 1000);


        const days =
            Math.floor(totalSeconds / 86400);


        const remainingAfterDays =
            totalSeconds % 86400;


        const hours =
            Math.floor(remainingAfterDays / 3600);


        const minutes =
            Math.floor(
                (remainingAfterDays % 3600) / 60
            );


        const seconds =
            remainingAfterDays % 60;


        // Display the result
        document.getElementById("counter").innerHTML =
            `${years} years<br>
             ${months} months<br>
             ${days} days<br>
             ${String(hours).padStart(2, "0")}:
             ${String(minutes).padStart(2, "0")}:
             ${String(seconds).padStart(2, "0")}`;


        document.getElementById("startDate").textContent =
            startDate.toLocaleString();
    }


    function chooseDate() {

        const input =
            prompt(
                "Enter your starting date and time:\n\n" +
                "Example: 2010-08-14 12:00:00"
            );

        if (!input) return;


        const formatted =
            input.replace(" ", "T");


        const newDate =
            new Date(formatted);


        if (isNaN(newDate.getTime())) {

            alert(
                "That date doesn't seem to be valid."
            );

            return;
        }


        startDate = newDate;

        calculateTime();
    }


    // Update immediately
    calculateTime();


    // Update every second
    setInterval(
        calculateTime,
        1000
    );

</script>

</body>
</html>
