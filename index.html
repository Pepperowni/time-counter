<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#0d0d12">

    <title>❤️ V+M ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #321b29 0%,
                    #121217 45%,
                    #08080b 100%
                );

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        .app {

            width: 100%;

            max-width: 520px;

            padding: 30px 22px;

            text-align: center;
        }


        .heart {

            font-size: 40px;

            margin-bottom: 4px;

            animation: heartbeat 2.2s infinite;
        }


        .title {

            font-size: 36px;

            font-weight: 700;

            letter-spacing: 3px;

            margin: 0;
        }


        .since {

            margin-top: 5px;

            font-size: 17px;

            color: #b8aab2;

            letter-spacing: 4px;
        }


        .start-date {

            margin-top: 28px;

            font-size: 14px;

            color: #999098;
        }


        .counter {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 28px;
        }


        .unit {

            width: 31%;

            padding: 20px 8px 15px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 20px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.28);
        }


        .number {

            font-size: 36px;

            font-weight: 700;

            line-height: 1;

            font-variant-numeric:
                tabular-nums;
        }


        .label {

            margin-top: 10px;

            font-size: 10px;

            color: #aaa1a7;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .clock {

            margin-top: 22px;

            font-size: 35px;

            font-weight: 600;

            letter-spacing: 2px;

            font-variant-numeric:
                tabular-nums;

            text-shadow:
                0 0 25px
                rgba(255,255,255,0.12);
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.12);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }
        }


        @media (max-width: 360px) {

            .number {
                font-size: 29px;
            }

            .clock {
                font-size: 29px;
            }

            .title {
                font-size: 31px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <div class="heart">
        ❤️
    </div>


    <h1 class="title">
        V+M
    </h1>


    <div class="since">
        since
    </div>


    <div class="start-date">
        14 September 2025 · 17:00
    </div>


    <div class="counter">


        <div class="unit">

            <div
                class="number"
                id="years">
                0
            </div>

            <div class="label">
                Years
            </div>

        </div>


        <div class="unit">

            <div
                class="number"
                id="months">
                0
            </div>

            <div class="label">
                Months
            </div>

        </div>


        <div class="unit">

            <div
                class="number"
                id="days">
                0
            </div>

            <div class="label">
                Days
            </div>

        </div>

    </div>


    <div
        class="clock"
        id="clock">

        00 : 00 : 00

    </div>


</div>



<script>


    /*
     * FIXED START DATE
     *
     * 14 September 2025
     * 17:00 local time
     */

    const startDate =
        new Date(
            2025,
            8,
            14,
            17,
            0,
            0
        );


    function calculateTime() {


        const now = new Date();


        /*
         * YEARS
         */

        let years =
            now.getFullYear()
            -
            startDate.getFullYear();


        let anniversary =
            new Date(startDate);


        anniversary.setFullYear(
            startDate.getFullYear()
            +
            years
        );


        if (anniversary > now) {

            years--;

            anniversary =
                new Date(startDate);

            anniversary.setFullYear(
                startDate.getFullYear()
                +
                years
            );
        }


        /*
         * MONTHS
         */

        let months =
            now.getMonth()
            -
            anniversary.getMonth();


        if (months < 0) {
            months += 12;
        }


        let monthPoint =
            new Date(anniversary);


        monthPoint.setMonth(
            anniversary.getMonth()
            +
            months
        );


        if (monthPoint > now) {

            months--;

            monthPoint =
                new Date(anniversary);

            monthPoint.setMonth(
                anniversary.getMonth()
                +
                months
            );
        }


        /*
         * REMAINING DAYS + TIME
         */

        const difference =
            now.getTime()
            -
            monthPoint.getTime();


        const totalSeconds =
            Math.floor(
                difference / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const remainingSeconds =
            totalSeconds % 86400;


        const hours =
            Math.floor(
                remainingSeconds / 3600
            );


        const minutes =
            Math.floor(
                (remainingSeconds % 3600) / 60
            );


        const seconds =
            remainingSeconds % 60;


        /*
         * UPDATE DISPLAY
         */

        document.getElementById(
            "years"
        ).textContent = years;


        document.getElementById(
            "months"
        ).textContent = months;


        document.getElementById(
            "days"
        ).textContent = days;


        document.getElementById(
            "clock"
        ).textContent =

            String(hours).padStart(2, "0")
            +
            " : "
            +
            String(minutes).padStart(2, "0")
            +
            " : "
            +
            String(seconds).padStart(2, "0");

    }


    /*
     * START
     */

    calculateTime();


    /*
     * UPDATE EVERY SECOND
     */

    setInterval(
        calculateTime,
        1000
    );

</script>


</body>

</html>
